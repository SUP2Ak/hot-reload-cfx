name: Release Build

on:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build UI
        run: cargo build --package hot-reload-ui --release
      
      - name: Build Watcher Windows
        run: cargo build --package hot-reload-watcher --release
      
      - name: Generate Windows Version Files
        run: |
          echo "{\"version\": \"$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == \"hot-reload-watcher\") | .version')\"}" > version.watcher.json
          echo "{\"version\": \"$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == \"hot-reload-ui\") | .version')\"}" > version.ui.json
      
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-artifacts
          path: |
            target/release/hot-reload-ui.exe
            target/release/hot-reload-watcher.exe
            version.*.json

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Watcher Linux
        run: cargo build --package hot-reload-watcher --release
      
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-artifacts
          path: target/release/hot-reload-watcher

  build-fxserver:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      
      - name: Install yarn
        run: npm install -g yarn@1.22.22
      
      - name: Build FXServer Resource
        run: cargo run --package hot-reload-build
      
      - name: Generate FXServer Version
        run: |
          echo "{\"version\": \"$(jq -r '.version' resources/hot-reload/package.json)\"}" > version.fxserver.json

      - name: Download All Artifacts
        uses: actions/download-artifact@v3

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-artifacts/hot-reload-ui.exe
            windows-artifacts/hot-reload-watcher.exe
            windows-artifacts/version.*.json
            linux-artifacts/hot-reload-watcher
            hot-reload-fxserver.zip
            version.fxserver.json 