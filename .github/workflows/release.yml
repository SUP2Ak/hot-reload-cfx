name: Release Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build UI
        run: cargo build --package hot-reload-ui --release
      
      - name: Build Watcher Windows
        run: cargo build --package hot-reload-watcher --release
      
      - name: Generate Windows Version Files
        shell: bash
        run: |
          WATCHER_VERSION=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "hot-reload-watcher") | .version')
          UI_VERSION=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "hot-reload-ui") | .version')
          echo "{\"version\": \"$WATCHER_VERSION\"}" > version.watcher.json
          echo "{\"version\": \"$UI_VERSION\"}" > version.ui.json
      
      - uses: actions/upload-artifact@master
        with:
          name: windows-artifacts
          path: |
            target/release/*.exe
            version.*.json

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Watcher Linux
        run: cargo build --package hot-reload-watcher --release
      
      - uses: actions/upload-artifact@master
        with:
          name: linux-artifacts
          path: target/release/hot-reload-watcher

  build-fxserver:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      
      - name: Install yarn
        run: npm install -g yarn@1.22.22
      
      - name: Build FXServer
        run: |
          cd resources/hot-reload
          yarn install --ignore-engines
          yarn build
      
      - name: Create FXServer zip
        run: |
          cd resources/hot-reload
          mkdir -p hot-reload
          cp -r package.json src tsconfig.json dist yarn.lock vite.config.ts hot-reload/
          echo 'fx_version "cerulean"
          author "SUP2Ak"
          game "common"
          use_experimental_fxv2_oal "yes"
          repository "https://github.com/SUP2Ak/hot-reload-fivem"
          description "Hot Reload for FiveM"
          license "MIT"
          version "1.0.0"
          
          server_only "yes"
          server_script "dist/server.js"
          dependency "yarn"' > hot-reload/fxmanifest.lua
          zip -r ../../hot-reload-fxserver.zip hot-reload/
      
      - name: Generate FXServer Version
        run: |
          echo "{\"version\": \"$(jq -r '.version' resources/hot-reload/package.json)\"}" > version.fxserver.json

      - uses: actions/download-artifact@master
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-artifacts/target/release/*.exe
            artifacts/windows-artifacts/version.*.json
            artifacts/linux-artifacts/hot-reload-watcher
            hot-reload-fxserver.zip
            version.fxserver.json 